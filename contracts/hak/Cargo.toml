[package]
name = "hak"
version = "0.1.0"
edition = "2021"
description = "Agyion kernel contract — Fade + Pod + Trigger + Envoy templates (SPEC_V2)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm-tests = []

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = "2"
sha2 = "0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
