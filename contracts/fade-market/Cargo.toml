[package]
name = "fade-market"
version = "0.1.0"
edition = "2021"
publish = false
description = "Agyion public merchant pickup market"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm-tests = []

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
