[package]
name = "private-pool"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = { version = "28.0.0", features = ["hazmat-crypto"] }
[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["hazmat-crypto", "testutils"] }
serde_json = "1"
ed25519-dalek = "2"
[features]
proof-tests = []
wasm-tests = ["proof-tests"]
[profile.release]
opt-level = "z"
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
strip = "symbols"
