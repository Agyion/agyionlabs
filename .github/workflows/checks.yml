name: Source and contract checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install locked workspace dependencies
        run: |
          npm ci
          npm --prefix landing ci
          npm --prefix app ci
          npm --prefix privacy ci
          npm --prefix contracts/private-pool/client ci
          npm --prefix market ci
      - name: Application, privacy, client and tool tests
        run: |
          npm test
          python3 scripts/test_deploy_testnet.py
      - name: Browser persistence and concurrent submission guards
        run: |
          npx --no-install playwright install chromium
          MARKET_JOURNAL_BROWSER_TEST=1 node --experimental-strip-types --test market/tests/journal-browser.test.ts
          PRIVATE_JOURNAL_BROWSER_TEST=1 node --import ./contracts/private-pool/client/test-register.mjs --test contracts/private-pool/client/journal.test.ts
          PUBLIC_SOURCE_BROWSER_TEST=1 node --test scripts/tests/public-source-lock-browser.test.mjs
      - name: Type and style checks
        run: |
          npm --prefix app run typecheck
          npm --prefix app run lint
          npm --prefix landing run lint
          npm --prefix landing run check
      - name: Public proof fixture provenance
        run: node contracts/private-pool/tools/verify-fixture-provenance.mjs
      - name: Verify public proving assets
        run: |
          node scripts/fetch-private-prover.mjs --development --base https://agyion.jasurbek-rustamov.workers.dev/
      - name: Reproduce private proofs and adversarial circuit cases
        run: |
          node scripts/prepare-private-integration.mjs --development artifacts/privacy-ci
          PRIVACY_ARTIFACT_DIR="$PWD/artifacts/privacy-ci" \
          PRIVACY_CIRCUIT_DIR="$PWD/artifacts/privacy-ci/circuit" \
          PRIVACY_PROVER_MANIFEST="$PWD/artifacts/privacy-ci/prover-cases.json" \
          PRIVACY_DISCLOSURE_PROOF_TEST=1 PRIVACY_PROVER_TESTS=1 PRIVACY_CIRCUIT_TESTS=1 \
          node --test --test-concurrency=1 privacy/test/disclosure-proof.test.mjs privacy/test/prover-integration.test.mjs privacy/test/prover-verification.test.mjs privacy/test/transition-circuit.test.mjs
      - name: Build the static testnet site
        run: |
          npm --prefix landing run build
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { releaseExpectations } from './scripts/release-expectations.mjs';
          const release = releaseExpectations({ EXPECTED_PUBLIC_RELEASE: 'active-testnet' });
          execFileSync('npm', ['--prefix', 'app', 'run', 'build'], {
            stdio: 'inherit',
            env: { ...process.env, NEXT_PUBLIC_AGYION_MODE: 'soroban', NEXT_PUBLIC_AGYION_CONTRACT_ID: release.contractId, NEXT_PUBLIC_AGYION_WASM_HASH: release.wasmHash, NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org', NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015' }
          });
          NODE
          node scripts/assemble-site.mjs
      - name: Dependency advisories
        run: |
          npm audit --audit-level=high
          npm --prefix app audit --audit-level=high
          npm --prefix landing audit --audit-level=high
          npm --prefix privacy audit --audit-level=high
          npm --prefix contracts/private-pool/client audit --audit-level=high
          npm --prefix market audit --audit-level=high

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      PRIVATE_POOL_ARTIFACTS: ${{ github.workspace }}/contracts/private-pool/fixtures/verified-v2
      PRIVATE_POOL_RESULTS: ${{ github.workspace }}/artifacts/ci-private
      PRIVATE_POOL_WASM: ${{ github.workspace }}/contracts/private-pool/target/wasm32v1-none/release/private_pool.wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.96.1
          targets: wasm32v1-none
          components: clippy
      - name: Install the pinned Stellar contract builder
        run: |
          mkdir -p "$RUNNER_TEMP/stellar-bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/stellar.tar.gz"
          printf '%s  %s\n' '207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc' "$RUNNER_TEMP/stellar.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/stellar.tar.gz" -C "$RUNNER_TEMP/stellar-bin"
          printf '%s\n' "$RUNNER_TEMP/stellar-bin" >> "$GITHUB_PATH"
      - name: Build actual WASM test inputs
        run: |
          stellar contract build --locked --manifest-path contracts/agyion/Cargo.toml --optimize=false
          stellar contract build --locked --manifest-path contracts/private-pool/Cargo.toml --optimize=false
          stellar contract build --locked --manifest-path contracts/fade-market/Cargo.toml --optimize=false
      - name: Native and WASM contract tests
        run: |
          cargo test --locked --manifest-path contracts/agyion/Cargo.toml --features wasm-tests
          cargo test --locked --manifest-path contracts/private-pool/Cargo.toml --features wasm-tests
          cargo test --locked --manifest-path contracts/fade-market/Cargo.toml --features wasm-tests
      - name: Strict Rust checks
        run: |
          cargo clippy --locked --manifest-path contracts/agyion/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path contracts/private-pool/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path contracts/fade-market/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Rust dependency advisories
        run: |
          cargo audit --file contracts/agyion/Cargo.lock
          cargo audit --file contracts/private-pool/Cargo.lock
          cargo audit --file contracts/zk-preimage/Cargo.lock
          cargo audit --file contracts/fade-market/Cargo.lock
