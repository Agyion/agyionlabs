name = "agyion"
compatibility_date = "2026-09-20"

# Existing production routes/settings verified against Cloudflare on 2026-09-26.
workers_dev = true
preview_urls = true
routes = [
  { pattern = "agyionlabs.dev", custom_domain = true },
]

[assets]
directory = "./site"
# The app, instrument directory and six detail routes are real HTML assets.
# Missing asset paths must remain 404 instead of receiving the landing document.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
